services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: brewlite
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite_local_password
    ports:
      - "5433:5432"
    volumes:
      - brewlite-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["sh", "-c", "npm run db:setup && npm run start:prod"]
    environment:
      DATABASE_URL: postgresql://brewlite:brewlite_local_password@db:5432/brewlite?schema=public
      JWT_SECRET: local-only-brewlite-docker-secret
      JWT_EXPIRATION: 1d
      LOGIN_MAX_FAILED_ATTEMPTS: 5
      LOGIN_LOCKOUT_DURATIONS_MINUTES: 1,5
      MOCK_PAYMENTS_ENABLED: "true"
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  brewlite-postgres-data:
