
name: BrewLite CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  web-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  deploy:
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - web-quality
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: production
    concurrency:
      group: brewlite-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          for name in \
            NEON_DATABASE_URL RENDER_API_KEY RENDER_SERVICE_ID RENDER_API_URL \
            VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_PRODUCTION_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub secret or variable: $name"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          npm ci
          npx prisma migrate deploy

      - name: Request Render deployment
        id: render-deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq -cn --arg commitId "$GITHUB_SHA" '{commitId: $commitId, clearCache: "do_not_clear"}')" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          deploy_id="$(jq -er '.id // empty' <<< "$response")"
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Render did not return a deployment ID. Check for an overlapping deploy in Render."
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.render-deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            response="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")"
            status="$(jq -r '.status' <<< "$response")"
            echo "Render deployment status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deployment ended with status $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Render deployment"
          exit 1

      - name: Smoke test Render API
        env:
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 \
            "${RENDER_API_URL%/}/health"

      - name: Build and verify Vercel deployment before promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node -e "require('fs').writeFileSync('.vercel/project.json', JSON.stringify({orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID}))"

          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

          deployment_output="$(npx --yes vercel@latest deploy \
            --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" \
            | grep -Eo 'https://[^[:space:]]+\.vercel\.app' \
            | tail -n 1)"
          if [[ -z "$deployment_url" ]]; then
            echo "::error::Could not determine the Vercel deployment URL"
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 \
            "$deployment_url"
          npx --yes vercel@latest promote "$deployment_url" \
            --yes --token="$VERCEL_TOKEN"
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 \
            "${VERCEL_PRODUCTION_URL%/}"
